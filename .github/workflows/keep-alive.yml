name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'      # 06:17 UTC, JAUH dari menit :00 (GitHub peak load)
  workflow_dispatch:           # biar bisa kau tes manual sekarang

permissions:
  contents: write              # WAJIB - default GITHUB_TOKEN sekarang read-only

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0       # butuh riwayat untuk cek umur commit terakhir

      - name: Ping site
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://knowrise.my.id/) || status="000"
          echo "HTTP $status"
          # 404 tetap dianggap hidup (Home bisa saja disembunyikan),
          # hanya 000 / 5xx yang menandakan masalah sungguhan
          if [ "$status" = "000" ] || [ "${status:0:1}" = "5" ]; then
            echo "::error::site tidak merespons (HTTP $status)"
            exit 1
          fi

      - name: Monthly keepalive commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "commit terakhir ${age} hari lalu"
          [ "$age" -lt 30 ] && { echo "masih muda, skip"; exit 0; }
          mkdir -p docs
          echo "- $(date -u +%Y-%m-%d) automated keepalive" >> docs/keepalive.log
          git add docs/keepalive.log
          git commit -m "chore: automated keepalive"
          git push origin HEAD:main